<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Venture Workbench</title><style>
:root{--nav:#102437;--ink:#183047;--muted:#61758a;--accent:#087e78;--bg:#f3f6fa;--line:#dce5ec}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.65 system-ui,sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer;border:0;border-radius:9px;padding:11px 16px;background:var(--accent);color:#fff;font-weight:650}button:hover{filter:brightness(.92)}button.secondary{background:#e8f1f2;color:#12655e}button:disabled{opacity:.5;cursor:default}a{color:var(--accent);font-weight:600}h1,h2,h3,p{margin:0 0 12px}h1{font-size:clamp(26px,4vw,38px);letter-spacing:-1px;line-height:1.25}h2{font-size:23px}small,.muted{color:var(--muted)}.layout{min-height:100vh;display:grid;grid-template-columns:250px 1fr}.side{background:var(--nav);color:white;padding:28px 20px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column}.brand{font-size:21px;font-weight:800;letter-spacing:-.5px}.tag{font-size:13px;color:#80cfc4;text-transform:uppercase;letter-spacing:1.6px}.nav{margin:32px 0;display:grid;gap:7px}.nav button{text-align:left;background:transparent;color:#bed0df}.nav button.active{background:#26485d;color:white}.side .bottom{margin-top:auto}.main{max-width:1220px;width:100%;padding:35px;margin:auto;align-self:start}.hero{background:linear-gradient(125deg,#102d40,#086c68);border-radius:20px;padding:32px;color:white;display:flex;justify-content:space-between;gap:20px;align-items:center}.hero p{color:#c7e8e4}.hero b{font-size:40px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin:20px 0}.card{background:white;border:1px solid var(--line);border-radius:14px;padding:21px;margin-bottom:15px}.stat strong{display:block;font-size:30px}.progress{height:9px;background:#d7e4e7;border-radius:20px;overflow:hidden}.progress i{display:block;background:#18b4a0;height:100%}.row{display:flex;gap:12px;align-items:center;justify-content:space-between}.pill{display:inline-block;font-size:13px;padding:3px 10px;border-radius:999px;background:#e3f4ef;color:#116b60;font-weight:650}.week{margin-top:26px}.lesson{display:grid;grid-template-columns:48px 1fr auto;gap:12px;align-items:center}.number{background:#eaf2f9;color:#244b68;display:grid;place-items:center;width:42px;height:42px;border-radius:12px;font-weight:750}.lesson h3{margin:0;font-size:17px}.lesson p{margin:0}.study{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:18px}.video{aspect-ratio:16/9;width:100%;border:0;border-radius:12px;background:#0b2030}.callout{background:#eff8f6;border-left:4px solid var(--accent);padding:14px;border-radius:8px;margin:15px 0}.answers{display:grid;gap:10px}.answers button{text-align:left;background:#edf2f6;color:var(--ink)}.answers .right{background:#d8f4e5}.answers .wrong{background:#ffe5e5}textarea,input,select{width:100%;padding:12px;border:1px solid #c7d5df;border-radius:9px;background:white;color:var(--ink)}textarea{min-height:130px;resize:vertical}.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}.day{padding:12px 4px;text-align:center;background:#eaf0f5;border-radius:8px;font-size:14px}.day.on{background:#c3eedf;color:#075e50;font-weight:bold}.auth{min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(circle at top right,#176b71,#102437 60%)}.auth .card{max-width:420px;width:100%;padding:30px}.auth label{display:block;margin:12px 0 4px}.auth button{width:100%;margin-top:18px}.error{color:#b32636}.links a{display:block;padding:9px 0;border-bottom:1px solid var(--line)}.search{max-width:450px}.canvas{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.canvas label{font-weight:650}.canvas textarea{margin-top:6px}.hide{display:none!important}@media(max-width:850px){.layout{display:block}.side{position:relative;height:auto;padding:16px}.nav{display:flex;overflow:auto;margin:12px 0 0}.nav button{white-space:nowrap}.side .bottom{margin-top:10px}.main{padding:18px}.study{display:block}.grid{grid-template-columns:1fr 1fr}.hero{display:block}.canvas{grid-template-columns:1fr}.lesson{grid-template-columns:40px 1fr}.lesson button{grid-column:2}.calendar{gap:4px}}@media(max-width:430px){.grid{grid-template-columns:1fr}}
.modulegrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin:16px 0 24px}.modulecard{background:white;text-align:left;border:1px solid var(--line);color:var(--ink);padding:18px;min-height:145px}.modulecard h3{font-size:17px;margin:5px 0}.modulecard .tag,.sectiontitle .tag{color:#087e78}.modulecard p{font-size:14px;color:var(--muted)}.sectiontitle{border-left:4px solid var(--accent);padding:5px 0 5px 14px;margin-bottom:12px}.quizitem{border-top:1px solid var(--line);padding:19px 0}.feedback{margin:10px 0 0;font-size:15px;color:#176959}.answers button{font-weight:500;line-height:1.5}.answers .right{color:#075d3e}.answers .wrong{color:#8c2835}@media(max-width:600px){.modulegrid{grid-template-columns:1fr}} .tablewrap{overflow:auto}.modeltable{border-collapse:collapse;width:100%;min-width:690px}.modeltable th,.modeltable td{text-align:left;padding:12px;border-bottom:1px solid var(--line);vertical-align:top}.modeltable th{background:#edf4f5}.modeltable td button{font-size:14px;text-align:left}.calcgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin:16px 0}@media(max-width:600px){.calcgrid{grid-template-columns:1fr}}</style></head><body><div id="app"></div><script>
const lessons=[["Mô hình kinh doanh là gì?","Business model","Giải thích doanh nghiệp tạo ra, chuyển giao và thu về giá trị như thế nào. Khác với kế hoạch kinh doanh, mô hình là logic vận hành; kế hoạch bổ sung mục tiêu, lịch và dự báo.","Một quán cà phê thu tiền theo ly; phần mềm quản lý thu tiền theo tháng. Cùng phục vụ nhu cầu nhưng cơ chế doanh thu khác.","Chọn một startup giả định và mô tả khách hàng, giá trị, cách kiếm tiền trong 3 câu.","Business model trả lời câu hỏi nào?","Cách tạo và thu giá trị","Chỉ màu logo","Chỉ tên founder","QoAOzMTLP5s","Tách người dùng, người mua, giá trị và cơ chế kiếm tiền. Kiểm tra mô hình có thể lặp lại với chi phí phục vụ hợp lý không.","Nếu founder chỉ mô tả tính năng, hỏi ai trả tiền, vì sao và từ ngân sách nào."],["9 khối Business Model Canvas","BMC","Canvas liên kết phân khúc, giá trị, kênh, quan hệ, doanh thu, nguồn lực, hoạt động, đối tác và chi phí. Điền dưới dạng giả thuyết rồi kiểm chứng.","Ứng dụng đặt phòng: người trả tiền là doanh nghiệp; người dùng là nhân viên; phần mềm và hỗ trợ là nguồn lực.","Vẽ 9 ô cho ví dụ của bạn.","Canvas có bao nhiêu khối?","9","5","12","QoAOzMTLP5s","Mỗi khối là giả thuyết. Đọc Canvas theo chiều khách hàng → giá trị → kênh → doanh thu, sau đó kiểm tra năng lực vận hành và chi phí.","Đánh dấu khối chưa có dữ liệu, ưu tiên giả thuyết có thể làm toàn bộ mô hình thất bại."],["Customer Segments","Khách hàng","Phân biệt người dùng và người trả tiền; ưu tiên phân khúc có vấn đề cấp thiết, khả năng chi trả, tiếp cận được.","EdTech: học sinh sử dụng, phụ huynh trả tiền, trường có thể quyết định.","Liệt kê 3 nhóm khách và chọn 1 nhóm đầu tiên.","Ai có thể khác người dùng?","Người trả tiền","Tên miền","Màu thương hiệu","ReM1uqmVfP0","Phân khúc không phải chỉ là tuổi và giới tính; cần hành vi, nhu cầu, khả năng trả và khả năng tiếp cận.","Hỏi phân khúc nào đang chịu vấn đề thường xuyên nhất và ai giữ ngân sách."],["Value Proposition","Giá trị","Giá trị là lợi ích đo được cho nhóm khách cụ thể. Dùng jobs, pains, gains để liên kết nhu cầu với giải pháp.","Dịch vụ giao hàng giúp nhà bán giảm thời gian đóng gói và tỷ lệ giao thất bại.","Viết một câu giá trị có nhóm khách, vấn đề, lợi ích.","Giá trị tốt nhất nên dựa vào?","Nhu cầu có bằng chứng","Số tính năng","Tên sản phẩm","ReM1uqmVfP0","Jobs gồm nhiệm vụ chức năng, xã hội, cảm xúc. Pains là trở ngại; gains là kết quả mong muốn. Chọn pain đáng giải quyết trước khi viết tính năng.","Hỏi khách đang dùng giải pháp gì, mức cải thiện thực tế là bao nhiêu."],["Channels","Kênh","Kênh đưa khách từ nhận biết đến đánh giá, mua, nhận sản phẩm và hậu mãi. Đo tỷ lệ chuyển đổi và chi phí từng bước.","SaaS B2B: webinar tạo lead, demo hỗ trợ quyết định, hợp đồng hoàn tất giao dịch.","Vẽ hành trình 5 bước và đề xuất KPI cho từng bước.","Kênh có nhiệm vụ gì?","Tiếp cận và giao giá trị","Thay thế doanh thu","Định giá cổ phần","hyYCn_kAngI","Kênh sở hữu (website, đội sales) khác kênh đối tác (đại lý, nền tảng). Mỗi kênh có CAC, conversion và mức kiểm soát khác nhau.","Nếu traffic tăng nhưng đơn hàng không tăng, phân tích điểm rơi trong funnel."],["Customer Relationships","Quan hệ","Quan hệ có thể tự phục vụ, hỗ trợ cá nhân, cộng đồng hoặc quản lý khách hàng chuyên sâu; chọn theo giá trị và chi phí phục vụ.","Khách enterprise có account manager; khách cá nhân dùng hướng dẫn tự động.","Chọn cách onboarding, hỗ trợ, giữ chân khách.","Churn cao cho thấy điều gì?","Khách rời bỏ nhiều","Doanh thu luôn tăng","Không cần hỗ trợ","z1iF1c8w5Lg","Retention phản ánh giá trị liên tục; chăm sóc chuyên sâu có thể tăng chi phí. Chọn automation khi quy trình lặp lại và khách tự giải quyết được.","Hỏi vì sao khách quay lại và chi phí hỗ trợ mỗi khách."],["Revenue Streams","Doanh thu","Xác định ai trả, trả vì điều gì, bao nhiêu, khi nào. Doanh thu khác lợi nhuận và dòng tiền.","100 khách trả 200.000đ/tháng tạo MRR 20 triệu, chưa trừ chi phí.","Tạo 2 mức giá và giả định số khách.","MRR của 100 khách × 200.000đ là?","20 triệu","2 triệu","200 triệu","oWZbWzAyHAE","Doanh thu một lần, định kỳ, theo usage và hoa hồng có khả năng dự báo khác nhau. Tiền thu trước chưa nhất thiết là doanh thu đã ghi nhận.","Hỏi hợp đồng, thời điểm thanh toán, tỷ lệ hoàn tiền và doanh thu thực tế."],["Key Resources","Nguồn lực","Tài sản thiết yếu gồm nhân sự, tài chính, dữ liệu, công nghệ và thương hiệu. Phân biệt sở hữu với thuê.","Marketplace cần hệ thống thanh toán, dữ liệu giao dịch và đội vận hành.","Chọn 3 tài sản cần có và 1 rủi ro thiếu hụt.","Nguồn lực chính là?","Tài sản cần để vận hành","Tất cả chi phí","Mọi khách hàng","","Nguồn lực phải phục vụ hoạt động trọng yếu. Không phải tài sản nào cũng cần sở hữu; thuê hạ tầng có thể giảm vốn đầu tư.","Hỏi nguồn lực nào nếu mất sẽ làm gián đoạn dịch vụ."],["Key Activities","Hoạt động","Các công việc cốt lõi phải làm tốt để cung cấp giá trị, ví dụ phát triển sản phẩm, tuyển nhà cung cấp, hỗ trợ.","Ứng dụng đặt lịch cần duy trì độ chính xác, xử lý xung đột và hỗ trợ.","Chọn 3 hoạt động; đặt chỉ số chất lượng.","Hoạt động chính nên liên kết với?","Giá trị khách hàng","Màu website","Tên pháp nhân","","Một hoạt động trọng yếu cần chỉ số chất lượng, tốc độ và chi phí. Tự làm hay thuê ngoài phụ thuộc lợi thế cạnh tranh.","Hỏi hoạt động nào tạo giá trị khác biệt và thời gian xử lý hiện tại."],["Key Partners","Đối tác","Đối tác cung cấp nguồn lực, năng lực hoặc kênh mà startup khó tự làm; xem phụ thuộc và phương án dự phòng.","Startup thanh toán hợp tác ngân hàng và nhà cung cấp hạ tầng.","Lập danh sách đối tác, lợi ích hai bên, rủi ro.","Đối tác quan trọng vì?","Bổ sung năng lực và giảm rủi ro","Luôn thay thế khách","Không cần hợp đồng","","Đối tác có thể giảm chi phí, tăng tiếp cận hoặc cung cấp năng lực. Đánh giá phụ thuộc vào một đối tác duy nhất.","Hỏi kế hoạch dự phòng nếu đối tác thay đổi mức phí hoặc dừng hợp tác."],["Cost Structure","Chi phí","Chi phí cố định ít thay đổi theo sản lượng; biến đổi tăng theo số đơn vị. Phân biệt chi phí đầu tư và vận hành.","Phí thuê văn phòng cố định, phí giao hàng theo đơn biến đổi.","Tính chi phí tháng của mô hình giả định.","Phí giao mỗi đơn thường là?","Chi phí biến đổi","Vốn chủ sở hữu","Doanh thu","","Phân biệt chi phí cố định, biến đổi, trực tiếp và gián tiếp. Tính biên đóng góp trước khi dự báo mở rộng.","Hỏi chi phí nào tăng nhanh nhất khi số khách tăng gấp đôi."],["Workshop Canvas","Thực hành","Kiểm tra 9 khối có nhất quán, các giả định phải có chủ sở hữu, cách đo và hạn kiểm chứng.","Giá rẻ nhưng bán qua đội tư vấn đắt tiền có thể không khả thi.","Hoàn thiện BMC một trang, đánh dấu 3 giả định rủi ro.","BMC nên được cập nhật khi?","Có bằng chứng mới","Chỉ cuối năm","Không bao giờ","QoAOzMTLP5s","Tạo Canvas phiên bản hiện tại và phiên bản mục tiêu. Ghi ngày, bằng chứng, giả thuyết và chủ sở hữu nhiệm vụ.","Hỏi điều gì sẽ khiến nhóm thay đổi Canvas thay vì chỉ sửa cách diễn đạt."],["B2B, B2C, B2G","Phân loại","B2B bán cho tổ chức, B2C bán cho cá nhân, B2G bán cho cơ quan công. Khác nhau về chu kỳ bán, ngân sách, ra quyết định.","Phần mềm kế toán doanh nghiệp là B2B; ứng dụng tập thể dục cá nhân là B2C.","So sánh 3 mô hình theo người mua, kênh và chu kỳ bán.","Bán phần mềm cho công ty là?","B2B","B2C","P2P","oWZbWzAyHAE","B2B có thể có nhiều người tham gia quyết định, B2C thường quyết định cá nhân, B2G có quy trình mua sắm riêng.","Hỏi chu kỳ bán, người duyệt ngân sách và chi phí của một hợp đồng."],["SaaS & Subscription","Định kỳ","SaaS cung cấp phần mềm dưới dạng dịch vụ; subscription là cơ chế trả định kỳ, không chỉ phần mềm. Theo dõi MRR, churn và retention.","Khách thuê phần mềm 500.000đ/tháng thay vì mua giấy phép vĩnh viễn.","Thiết kế 2 gói tháng và tính MRR.","Subscription đặc trưng bởi?","Thanh toán định kỳ","Chỉ bán một lần","Chỉ quảng cáo","oWZbWzAyHAE","MRR là doanh thu định kỳ tháng, ARR là MRR×12 nếu ổn định; không tính phí một lần vào MRR.","Hỏi churn theo tháng, doanh thu mở rộng và chi phí hạ tầng mỗi khách."],["Marketplace & Platform","Thị trường hai phía","Nền tảng kết nối nhiều nhóm, thường có hiệu ứng mạng. Khởi đầu khó vì mỗi phía cần phía kia; đo thanh khoản và take rate.","100 triệu GMV × 10% phí tạo 10 triệu doanh thu nền tảng.","Chọn cách thu hút phía cung trước.","GMV 100 triệu × 10% phí =?","10 triệu doanh thu","100 triệu lợi nhuận","1 triệu doanh thu","oWZbWzAyHAE","GMV là tổng giá trị giao dịch, take rate là phần phí nền tảng, liquidity là khả năng ghép cung cầu.","Hỏi bên nào thiếu, mất bao lâu để người mua tìm thấy nhà cung cấp."],["Freemium & Advertising","Miễn phí","Freemium mở bản miễn phí lâu dài, thu tiền nâng cấp; quảng cáo bán sự chú ý của người dùng. Đo tỷ lệ trả tiền và chi phí phục vụ.","1.000 người dùng, 5% nâng cấp, giá 100.000đ/tháng tạo 5 triệu MRR.","Đề xuất tính năng miễn phí và trả tiền.","Freemium khác free trial ở đâu?","Có gói miễn phí lâu dài","Không có người trả tiền","Chỉ bán phần cứng","oWZbWzAyHAE","Freemium phải có ranh giới giá trị rõ; quảng cáo cần quy mô người dùng và phù hợp trải nghiệm.","Hỏi chi phí phục vụ người dùng miễn phí và tỷ lệ nâng cấp."],["E-commerce, D2C & Licensing","Bán hàng","D2C bán trực tiếp từ thương hiệu đến người dùng; licensing cấp quyền sử dụng tài sản trí tuệ; franchise cung cấp hệ thống kinh doanh theo hợp đồng.","Thương hiệu mỹ phẩm bán trực tiếp website; phần mềm cấp quyền dùng theo kỳ.","So sánh biên gộp, quyền kiểm soát và vốn cần thiết.","D2C giảm vai trò của?","Trung gian phân phối","Người dùng","Sản phẩm","oWZbWzAyHAE","D2C kiểm soát trải nghiệm và dữ liệu khách trực tiếp, nhưng tự chịu marketing, giao hàng và hậu mãi.","Hỏi biên gộp sau hoàn hàng, phí vận chuyển và CAC."],["Pricing & Unit Economics","Định giá","Giá phản ánh giá trị và sự sẵn sàng trả; CAC là chi phí có khách mới, LTV là giá trị đóng góp ước tính suốt vòng đời.","CAC 300.000đ; lãi gộp mỗi tháng 100.000đ; giữ khách 6 tháng: LTV 600.000đ, tỷ lệ 2.","Tính LTV/CAC của ví dụ riêng và nêu giả định.","LTV 600.000/CAC 300.000 bằng?","2","0,5","6","oWZbWzAyHAE","LTV dựa trên lãi gộp hoặc đóng góp ước tính; giả định churn ổn định chỉ là đơn giản hóa. CAC payback = CAC/đóng góp tháng.","Hỏi số liệu theo cohort và kênh; không dùng doanh thu lifetime thay cho lợi nhuận đóng góp mà không giải thích."],["Customer Discovery","Kiểm chứng","Phỏng vấn hành vi đã xảy ra; hỏi lần gần nhất gặp vấn đề, hậu quả, giải pháp hiện tại. Tránh hỏi dẫn dắt.","Thay vì hỏi bạn có mua không, hỏi lần gần nhất mất bao lâu và đã trả bao nhiêu.","Soạn 5 câu phỏng vấn trung lập.","Bằng chứng mạnh hơn là?","Hành vi thực tế","Lời khen","Ý kiến founder","z1iF1c8w5Lg","Ghi câu trả lời nguyên văn theo chủ đề, tìm mẫu hành vi. Không hỏi dẫn dắt hoặc yêu cầu khách dự đoán quá xa.","Hỏi bao nhiêu người thực sự đã trả tiền hoặc dành thời gian giải quyết vấn đề."],["MVP & Lean Startup","Thử nghiệm","MVP là phiên bản tối thiểu để kiểm chứng giả thuyết quan trọng. Xây dựng, đo, học; tiếp tục, thay đổi hoặc dừng theo dữ liệu.","Trang giới thiệu với đăng ký thử có thể kiểm tra nhu cầu trước khi phát triển hệ thống.","Viết giả thuyết, thử nghiệm, ngưỡng thành công.","MVP nhằm mục tiêu chính nào?","Học từ kiểm chứng","Đầy đủ mọi tính năng","Tối ưu logo","1hHMwLxN6EM","MVP có thể là concierge, landing page hoặc prototype. Xác định ngưỡng học trước khi thử; không đánh đồng MVP với sản phẩm lỗi.","Hỏi thử nghiệm rẻ nhất có thể bác bỏ giả thuyết là gì."],["TAM, SAM, SOM","Thị trường","TAM là tổng thị trường lý thuyết; SAM phần có thể phục vụ; SOM phần có thể đạt được trong thời hạn cụ thể. Ước tính từ dưới lên.","500 trường mục tiêu × 20 triệu/năm = 10 tỷ doanh thu tiềm năng trong phạm vi đó.","Tính 3 lớp thị trường với giả định có nguồn.","SOM là?","Phần có khả năng chiếm được","Toàn bộ thế giới","Tổng chi phí","hyYCn_kAngI","Bottom-up dùng số khách có thể tiếp cận nhân giá trị hợp đồng, kiểm tra bằng nguồn và giới hạn kênh. Không lấy phần trăm tùy tiện từ thị trường lớn.","Hỏi giả định số khách, giá và khả năng tiếp cận có cơ sở gì."],["Traction & PMF","Tăng trưởng","Traction là bằng chứng tiến triển như doanh thu, khách trả tiền, retention. PMF là tín hiệu sản phẩm đáp ứng nhu cầu thị trường, không chỉ lượt đăng ký.","100 đăng ký nhưng 2 người dùng lặp lại yếu hơn 30 khách trả tiền giữ chân tốt.","Chọn 3 KPI theo giai đoạn startup.","Chỉ số nào phản ánh giữ chân?","Retention","Lượt xem logo","Số slide","","Phân biệt vanity metrics với active usage, retention, doanh thu và mức độ giới thiệu. PMF là nhiều tín hiệu cùng hội tụ.","Hỏi người dùng quay lại theo cohort và vì sao khách rời bỏ."],["Tài chính & Break-even","Tài chính","Lãi gộp = doanh thu − giá vốn. Điểm hòa vốn đơn vị = chi phí cố định / (giá − biến phí đơn vị). Runway = tiền mặt / burn ròng nếu burn ổn định.","Chi phí cố định 30 triệu; giá 100k; biến phí 40k: hòa vốn 500 đơn.","Tính hòa vốn và runway với số liệu giả định.","30 triệu / 60.000 bằng?","500","50","5.000","","Dòng tiền khác lợi nhuận. Runway giảm khi burn tăng; tính nhiều kịch bản chứ không chỉ trung bình.","Hỏi runway theo kịch bản cơ sở và xấu, cùng mốc cần đạt trước khi hết tiền."],["Cạnh tranh & Moat","Chiến lược","Xác định đối thủ trực tiếp, gián tiếp và lựa chọn không làm gì. Moat là lợi thế khó sao chép, có thể đến từ mạng lưới, quy mô, dữ liệu hoặc chuyển đổi.","Khách có thể dùng Excel thay cho SaaS đặt lịch; đó là đối thủ gián tiếp.","Lập bảng 3 giải pháp thay thế theo giá trị, giá và rủi ro.","Đối thủ gián tiếp có thể là?","Excel thay cho SaaS","Chỉ các công ty giống hệt","Không ai","","Moat khác USP: USP giúp bán hôm nay, moat bảo vệ lợi thế theo thời gian. Đối thủ có thể là cách làm thủ công.","Hỏi điều gì khiến khách khó chuyển và đối thủ khó sao chép trong 12 tháng."],["Pitch Deck","Thuyết trình","Một pitch rõ ràng kể vấn đề, giải pháp, thị trường, mô hình, traction, cạnh tranh, đội ngũ và nhu cầu hỗ trợ. Dùng số liệu có nguồn.","Mở bằng tình huống cụ thể rồi chứng minh tác động, không mở bằng danh sách tính năng.","Viết pitch 60 giây và outline 8 slide.","Pitch nên bắt đầu bằng?","Vấn đề đáng giải quyết","Lịch sử mọi nhân viên","Các hiệu ứng slide","17XZGUX_9iM","Thông điệp cần rõ, ngắn, có minh chứng. Mỗi slide có một luận điểm, số liệu cần nguồn và ngày.","Hỏi nếu bỏ tất cả slide, người nghe có thể nhắc lại sản phẩm phục vụ ai và giải quyết gì không."],["Demo Day & Q&A","Ứng dụng","Demo Day là dịp startup trình bày sản phẩm và tiến triển trước nhà đầu tư, mentor hoặc đối tác. Chuẩn bị demo ổn định, câu trả lời bằng dữ liệu, kế hoạch follow-up.","Mentor hỏi CAC, startup giải thích nguồn số liệu, giai đoạn thử nghiệm và bước tiếp theo.","Chuẩn bị 10 câu hỏi nhà đầu tư và câu trả lời 30 giây.","Nếu chưa có số liệu, nên?","Nêu rõ chưa kiểm chứng và kế hoạch","Bịa số liệu","Né mọi câu hỏi","17XZGUX_9iM","Chuẩn bị demo offline dự phòng, kiểm tra số liệu và luyện Q&A theo thời gian. Sau sự kiện gửi follow-up với bước cụ thể.","Hỏi một câu khó nhất về mô hình và cách nhóm chứng minh câu trả lời."],["Đánh giá startup","Mentor","Đánh giá mức độ hiểu khách, bằng chứng nhu cầu, chất lượng giải pháp, khả năng kiếm tiền, năng lực đội và rủi ro. Tách giả thuyết khỏi dữ liệu.","Prototype chưa có doanh thu vẫn có thể có bằng chứng phỏng vấn và thử nghiệm tốt.","Chấm startup giả định theo 6 tiêu chí, mỗi tiêu chí 1–5 và lý do.","Một giả thuyết chưa kiểm chứng nên?","Đánh dấu và thử nghiệm","Coi như sự thật","Xóa khỏi phân tích","","Rubric cần phù hợp giai đoạn: pre-MVP ưu tiên bằng chứng nhu cầu, startup tăng trưởng ưu tiên unit economics và retention.","Hỏi bằng chứng nào sẽ thuyết phục mentor thay đổi điểm đánh giá."],["Capstone: hoàn thiện mô hình","Tổng kết","Kết nối Canvas với phỏng vấn, tài chính, traction và pitch. Mỗi quyết định cần bằng chứng hoặc kế hoạch kiểm chứng.","Một startup giả định hoàn thành BMC, bảng unit economics, pitch 3 phút và 30 ngày thử nghiệm.","Nộp BMC + 1 trang tài chính + pitch + 3 thử nghiệm ưu tiên.","Kết quả tốt nhất của khóa là?","Mô hình có logic và kế hoạch kiểm chứng","Chỉ nhớ định nghĩa","Chỉ xem hết video","","Capstone là bộ hồ sơ thống nhất: Canvas, giả định, chỉ số, dự báo và kế hoạch thử nghiệm. Trình bày rõ điểm chưa biết.","Hỏi ba rủi ro lớn nhất, người phụ trách và hạn kiểm chứng."],["B2B2C","Chuyên sâu","Doanh nghiệp trung gian mua hoặc phân phối sản phẩm tới người dùng cuối. Phải thuyết phục cả người mua tổ chức lẫn người dùng; KPI của hai nhóm khác nhau.","Một ứng dụng chăm sóc sức khỏe bán gói cho công ty, nhân viên dùng miễn phí. Giá tính theo số nhân viên đủ điều kiện.","Vẽ chuỗi người trả tiền, người dùng, người quyết định; đề xuất hai KPI.","Doanh nghiệp mua gói cho nhân viên sử dụng là?","B2B2C","B2C trực tiếp","C2C","oWZbWzAyHAE","Nếu doanh nghiệp không tái ký dù nhân viên thích sản phẩm, mô hình gặp rủi ro hợp đồng. Hỏi mentor: ai có quyền quyết định gia hạn?","Nếu doanh nghiệp không tái ký dù nhân viên thích sản phẩm, mô hình gặp rủi ro hợp đồng. Hỏi mentor: ai có quyền quyết định gia hạn?"],["C2C & P2P","Chuyên sâu","Cá nhân trao đổi hàng hóa/dịch vụ với cá nhân khác; nền tảng có thể thu phí giao dịch hoặc phí đăng tin. Niềm tin và xử lý tranh chấp quyết định tỷ lệ giao dịch.","Chợ đồ cũ kết nối người bán và người mua cá nhân; tính phí bảo vệ giao dịch.","Thiết kế cơ chế uy tín và giải quyết tranh chấp.","Yếu tố đặc biệt quan trọng của P2P?","Niềm tin giữa hai phía","Chỉ có một bên tham gia","Không có giao dịch","oWZbWzAyHAE","Đo số giao dịch thành công trên số đăng tin; hỏi ai chịu trách nhiệm nếu hàng không đúng mô tả.","Đo số giao dịch thành công trên số đăng tin; hỏi ai chịu trách nhiệm nếu hàng không đúng mô tả."],["Usage-Based Pricing","Chuyên sâu","Khách trả theo lượng sử dụng thay vì cố định theo tháng. Phải chọn đơn vị đo dễ hiểu, phản ánh giá trị và kiểm soát dự báo chi phí.","Dịch vụ API tính 100đ mỗi lượt; khách gọi 30.000 lượt trả 3 triệu đồng.","Thiết kế biểu giá bậc thang và dự báo hóa đơn.","30.000 lượt × 100đ?","3 triệu","300 nghìn","30 triệu","oWZbWzAyHAE","Rủi ro là khách bất ngờ hóa đơn hoặc chi phí biến đổi tăng. Hỏi về giới hạn chi tiêu.","Rủi ro là khách bất ngờ hóa đơn hoặc chi phí biến đổi tăng. Hỏi về giới hạn chi tiêu."],["Pay-per-Transaction","Chuyên sâu","Thu phí từng giao dịch thành công; khác subscription vì doanh thu phụ thuộc khối lượng giao dịch. Tính phí cố định hoặc phần trăm.","Dịch vụ thanh toán thu 1% giao dịch 200 triệu, doanh thu phí 2 triệu.","Tính phí của ba mức giao dịch, so sánh với subscription.","1% của 200 triệu là?","2 triệu","20 triệu","200 triệu","oWZbWzAyHAE","Cần trừ chi phí xử lý thanh toán và hoàn tiền để ra đóng góp thực.","Cần trừ chi phí xử lý thanh toán và hoàn tiền để ra đóng góp thực."],["Commission & Brokerage","Chuyên sâu","Môi giới tạo giá trị bằng việc kết nối, tư vấn, đàm phán và thu hoa hồng khi giao dịch. Không nhất thiết sở hữu hàng hóa.","Môi giới tuyển dụng thu phí bằng 15% lương năm đầu; hợp đồng 240 triệu tạo phí 36 triệu.","Lập quy trình tìm khách và điều kiện ghi nhận doanh thu.","15% của 240 triệu?","36 triệu","24 triệu","3,6 triệu","oWZbWzAyHAE","Chu kỳ thanh toán dài và giao dịch ngoài nền tảng; hỏi cách duy trì chất lượng nguồn khách.","Chu kỳ thanh toán dài và giao dịch ngoài nền tảng; hỏi cách duy trì chất lượng nguồn khách."],["Affiliate Marketing","Chuyên sâu","Đơn vị giới thiệu khách nhận hoa hồng theo hành động đủ điều kiện, chẳng hạn mua hàng. Khác marketplace vì thường không xử lý giao dịch.","Trang review gắn liên kết nhà bán, nhận 5% cho đơn 1 triệu đủ điều kiện.","Tính thu nhập từ 2.000 click, 3% mua, hoa hồng 50.000đ.","2.000 × 3% × 50.000đ?","3 triệu","30 triệu","300 nghìn","oWZbWzAyHAE","Phụ thuộc chính sách chương trình và tracking; minh bạch quan hệ tài trợ.","Phụ thuộc chính sách chương trình và tracking; minh bạch quan hệ tài trợ."],["Advertising Model","Chuyên sâu","Nhà quảng cáo trả tiền để tiếp cận nhóm người dùng; nhà xuất bản cần cân bằng trải nghiệm, chất lượng đối tượng và doanh thu.","Website có 200.000 lượt hiển thị quảng cáo, CPM 40.000đ; doanh thu giả định 8 triệu trước chi phí.","So sánh CPM với CPC và CPA.","200.000 lượt × 40.000đ/1.000 lượt?","8 triệu","80 triệu","800 nghìn","oWZbWzAyHAE","Không nhầm lượt truy cập với lượt quảng cáo đủ điều kiện; theo dõi fill rate và retention.","Không nhầm lượt truy cập với lượt quảng cáo đủ điều kiện; theo dõi fill rate và retention."],["Lead Generation","Chuyên sâu","Tạo khách hàng tiềm năng đủ điều kiện cho đối tác, thu tiền theo lead hoặc cuộc hẹn. Chất lượng quan trọng hơn số form.","Đơn vị cung cấp 80 lead đạt tiêu chuẩn × 200.000đ = 16 triệu.","Định nghĩa lead đạt chuẩn và chính sách hoàn phí.","80 × 200.000đ?","16 triệu","1,6 triệu","160 triệu","oWZbWzAyHAE","Rủi ro tranh cãi về chất lượng và đồng ý sử dụng dữ liệu; hỏi tiêu chuẩn xác minh.","Rủi ro tranh cãi về chất lượng và đồng ý sử dụng dữ liệu; hỏi tiêu chuẩn xác minh."],["Licensing & Royalty","Chuyên sâu","Chủ tài sản trí tuệ cấp quyền sử dụng theo phạm vi, thời hạn và điều kiện; thu phí cố định hoặc royalty. Không chuyển giao toàn bộ sở hữu.","Chủ phần mềm cho đối tác dùng thư viện, thu 3% doanh thu liên quan.","Phác thảo phạm vi, thời hạn, phí và quyền kiểm tra doanh thu.","Licensing thường chuyển giao gì?","Quyền sử dụng có điều kiện","Toàn bộ quyền sở hữu luôn luôn","Quyền nhận miễn phí vĩnh viễn","oWZbWzAyHAE","Giới hạn lãnh thổ, mục đích và báo cáo là các biến quan trọng.","Giới hạn lãnh thổ, mục đích và báo cáo là các biến quan trọng."],["Franchise","Chuyên sâu","Bên nhượng quyền cấp quyền vận hành theo thương hiệu, quy trình và tiêu chuẩn; bên nhận quyền đầu tư cơ sở, trả phí ban đầu và royalty.","Chuỗi đồ uống nhượng quyền, thu phí thiết lập và phần doanh thu định kỳ.","So sánh nhượng quyền với tự mở cửa hàng.","Bên nhận quyền thường chịu gì?","Vốn vận hành địa điểm","Mọi chi phí trụ sở toàn cầu","Không phải tuân thủ tiêu chuẩn","oWZbWzAyHAE","Rủi ro chất lượng không đồng đều; hỏi cơ chế kiểm soát và hỗ trợ.","Rủi ro chất lượng không đồng đều; hỏi cơ chế kiểm soát và hỗ trợ."],["Razor-and-Blades","Chuyên sâu","Sản phẩm chính tạo cơ sở người dùng, vật tư hoặc dịch vụ bổ sung tạo doanh thu lặp lại. Không nhất thiết bán sản phẩm chính dưới giá vốn.","Máy lọc nước và lõi thay thế; lợi nhuận phụ thuộc số lần thay lõi và giữ chân.","Tính đóng góp vòng đời máy + lõi thay.","Doanh thu lặp lại đến từ đâu?","Vật tư hoặc dịch vụ bổ sung","Chỉ bán máy một lần","Chỉ quảng cáo","oWZbWzAyHAE","Khách có thể dùng vật tư khác; kiểm tra tỷ lệ mua lại thực tế.","Khách có thể dùng vật tư khác; kiểm tra tỷ lệ mua lại thực tế."],["Bundling & Unbundling","Chuyên sâu","Bundling gộp sản phẩm thành gói; unbundling tách chức năng thành sản phẩm riêng. Cần đo độ sẵn sàng trả và ảnh hưởng đến doanh thu hiện tại.","Gói thiết kế gồm công cụ ảnh, trình chiếu, template; khách mua cả gói hoặc riêng.","So sánh 3 mức giá và khách mục tiêu.","Khi nào bundling hợp lý?","Khi gói tăng giá trị cho nhóm khách","Luôn gộp mọi sản phẩm","Khi khách không dùng gì","oWZbWzAyHAE","Rủi ro trợ giá sản phẩm ít dùng; kiểm tra mức sử dụng từng thành phần.","Rủi ro trợ giá sản phẩm ít dùng; kiểm tra mức sử dụng từng thành phần."],["Rental & Leasing","Chuyên sâu","Cho thuê quyền sử dụng tài sản trong thời gian nhất định; chủ tài sản chịu khấu hao, bảo trì và rủi ro nhàn rỗi.","Cho thuê 10 máy thiết bị, 15 ngày/tháng, 300.000đ/ngày = 45 triệu doanh thu.","Tính tỷ lệ sử dụng để hòa vốn.","10 × 15 × 300.000đ?","45 triệu","4,5 triệu","450 triệu","oWZbWzAyHAE","Tách doanh thu khỏi lợi nhuận; hỏi tuổi thọ, bảo trì và tỷ lệ sử dụng.","Tách doanh thu khỏi lợi nhuận; hỏi tuổi thọ, bảo trì và tỷ lệ sử dụng."],["Product-as-a-Service","Chuyên sâu","Cung cấp kết quả sử dụng thay vì bán quyền sở hữu tài sản; nhà cung cấp chịu trách nhiệm duy trì hiệu năng.","Dịch vụ chiếu sáng thu tiền theo tháng kèm bảo trì thay vì bán đèn.","Định nghĩa SLA và chi phí phục vụ mỗi khách.","Khách trả chủ yếu cho gì?","Kết quả sử dụng","Quyền sở hữu bắt buộc","Chỉ hoa hồng quảng cáo","oWZbWzAyHAE","Rủi ro nghĩa vụ dài hạn và dòng tiền đầu tư ban đầu.","Rủi ro nghĩa vụ dài hạn và dòng tiền đầu tư ban đầu."],["Managed Services","Chuyên sâu","Nhà cung cấp thực hiện quy trình liên tục cho khách, kết hợp nhân sự và công nghệ. Doanh thu theo hợp đồng; biên phụ thuộc năng suất và SLA.","Công ty quản trị IT thu 20 triệu/tháng để vận hành hệ thống cho doanh nghiệp.","Tính số giờ phục vụ, biên đóng góp và năng lực tối đa.","Yếu tố giới hạn mở rộng?","Năng lực phục vụ thực tế","Tên dịch vụ","Số lượt xem trang","oWZbWzAyHAE","Đo thời gian xử lý, tỷ lệ tái ký và chi phí nhân sự.","Đo thời gian xử lý, tỷ lệ tái ký và chi phí nhân sự."],["Consulting & Professional Services","Chuyên sâu","Bán chuyên môn theo giờ, dự án hoặc retainer; định giá dựa trên giá trị hoặc nguồn lực. Khó mở rộng nếu doanh thu gắn chặt thời gian chuyên gia.","Tư vấn chiến lược thu 50 triệu/dự án, 80 giờ chuyên gia.","Tính doanh thu/giờ và chi phí trực tiếp.","50 triệu/80 giờ?","625 nghìn/giờ","62,5 nghìn/giờ","6,25 triệu/giờ","oWZbWzAyHAE","Chuẩn hóa deliverable hoặc công cụ để giảm phụ thuộc cá nhân.","Chuẩn hóa deliverable hoặc công cụ để giảm phụ thuộc cá nhân."],["Crowdfunding","Chuyên sâu","Nhiều người đóng góp để hỗ trợ dự án; có thể là phần thưởng, quyên góp hoặc đầu tư tùy cấu trúc. Cần phân biệt cam kết và giao hàng.","Dự án phần cứng nhận đặt trước 500 đơn × 1 triệu = 500 triệu, còn nghĩa vụ sản xuất.","Lập ngân sách thực hiện đơn và dự phòng.","Tiền đặt trước có nghĩa gì?","Có nghĩa vụ giao hàng theo cam kết","Luôn là lợi nhuận","Không phát sinh chi phí","oWZbWzAyHAE","Rủi ro giao hàng chậm hoặc vượt chi phí; mô hình đầu tư chịu quy định riêng.","Rủi ro giao hàng chậm hoặc vượt chi phí; mô hình đầu tư chịu quy định riêng."],["On-demand & Aggregator","Chuyên sâu","Điều phối cung ứng theo nhu cầu thời gian thực; aggregator gom nhà cung cấp dưới trải nghiệm thống nhất. Phải dự đoán cung, cầu và chất lượng dịch vụ.","Ứng dụng đặt dịch vụ sửa chữa theo giờ, điều phối thợ gần khách và thu phí.","Ước tính thời gian đáp ứng và phí cho một đơn.","KPI vận hành quan trọng?","Tỷ lệ nhận và hoàn thành đơn","Chỉ số follower","Số màu giao diện","oWZbWzAyHAE","Mất cân bằng cung cầu khiến thời gian chờ và chi phí hỗ trợ tăng.","Mất cân bằng cung cầu khiến thời gian chờ và chi phí hỗ trợ tăng."],["Loss Leader & Cross-sell","Chuyên sâu","Sản phẩm mồi có biên thấp để thu hút khách, sau đó bán bổ sung có biên cao hơn. Tổng đóng góp giỏ hàng phải dương.","Siêu thị khuyến mãi sản phẩm phổ biến, khách mua thêm sản phẩm khác.","Tạo giỏ hàng và tính đóng góp toàn giỏ.","Mô hình thành công khi?","Tổng đóng góp khách hàng đủ bù chi phí","Mọi sản phẩm đều lỗ","Chỉ tăng lượt ghé","oWZbWzAyHAE","Cần đo mua bổ sung thực sự, không suy diễn từ lượng khách.","Cần đo mua bổ sung thực sự, không suy diễn từ lượng khách."],["Data & Insights Services","Chuyên sâu","Thu phí phân tích, dashboard hoặc insight dựa trên dữ liệu mà doanh nghiệp có quyền sử dụng. Giá trị nằm ở quyết định tốt hơn, không phải số lượng dữ liệu.","Dịch vụ phân tích nhu cầu cho nhà bán dựa trên dữ liệu tổng hợp được phép sử dụng.","Đề xuất use case và chỉ số tác động.","Giá trị quan trọng nhất là?","Quyết định tốt hơn nhờ insight","Thu mọi dữ liệu bất kể quyền","Số cột càng nhiều càng tốt","oWZbWzAyHAE","Kiểm tra quyền dữ liệu, chất lượng, độ cập nhật và tính đại diện.","Kiểm tra quyền dữ liệu, chất lượng, độ cập nhật và tính đại diện."],["Open-source & Commercial Support","Chuyên sâu","Cung cấp mã nguồn mở theo giấy phép, thu tiền qua hỗ trợ, triển khai, hosting hoặc tính năng thương mại. Giữ ranh giới rõ giữa bản mở và dịch vụ.","Nhà phát triển dùng bản cộng đồng; doanh nghiệp mua hỗ trợ và SLA.","Thiết kế gói cộng đồng và doanh nghiệp.","Nguồn thu có thể là?","Hỗ trợ và hosting","Cấm mọi người xem mã mở","Chỉ quảng cáo bắt buộc","oWZbWzAyHAE","Kiểm tra điều kiện giấy phép và tính bền vững của cộng đồng.","Kiểm tra điều kiện giấy phép và tính bền vững của cộng đồng."],["Infrastructure & API","Chuyên sâu","Cung cấp hạ tầng hoặc năng lực kỹ thuật cho sản phẩm khác; thường thu theo usage, subscription hoặc hợp đồng doanh nghiệp.","Dịch vụ nhận diện tài liệu thu theo trang xử lý, khách tích hợp API.","Tính doanh thu và chi phí trên 1.000 trang.","Thước đo chất lượng phù hợp?","Độ ổn định và độ trễ","Số ảnh banner","Số slide trình bày","oWZbWzAyHAE","Chi phí hạ tầng, SLA và phụ thuộc nhà cung cấp ảnh hưởng trực tiếp đến biên.","Chi phí hạ tầng, SLA và phụ thuộc nhà cung cấp ảnh hưởng trực tiếp đến biên."],["Social Enterprise","Chuyên sâu","Theo đuổi mục tiêu xã hội cùng mô hình doanh thu bền vững. Cần đo tác động và tài chính riêng, tránh coi tác động là bằng chứng khả năng sinh lời.","Doanh nghiệp đào tạo việc làm thu học phí và tài trợ học bổng từ đối tác.","Chọn KPI tác động và KPI kinh doanh.","Cần theo dõi gì?","Cả tác động lẫn bền vững tài chính","Chỉ lượt thích","Chỉ doanh thu","oWZbWzAyHAE","Kiểm tra bên trả tiền và người hưởng lợi có khác nhau không.","Kiểm tra bên trả tiền và người hưởng lợi có khác nhau không."],["Case Study: Netflix","Case study","Minh họa subscription: người xem trả định kỳ để tiếp cận nội dung; chi phí nội dung và giữ chân là hai yếu tố lớn. Mô hình có thể kết hợp gói quảng cáo.","Giả định 1.000 thuê bao × 100.000đ/tháng = 100 triệu MRR, chưa trừ chi phí nội dung.","Vẽ Canvas và đề xuất cách giảm churn.","MRR giả định là?","100 triệu","10 triệu","1 tỷ","oWZbWzAyHAE","Không nhầm số thuê bao với lợi nhuận; hỏi chi phí nội dung trên mỗi khách.","Không nhầm số thuê bao với lợi nhuận; hỏi chi phí nội dung trên mỗi khách."],["Case Study: Canva","Case study","Minh họa freemium kết hợp subscription: người dùng miễn phí tạo thói quen, nhóm cần tính năng nâng cao có thể trả tiền. Giá trị nằm ở giảm thời gian thiết kế.","Giả định 2.000 người dùng, 4% trả 150.000đ/tháng tạo 12 triệu MRR.","Thiết kế mô hình nâng cấp dành cho nhóm marketing.","2.000 × 4% × 150.000đ?","12 triệu","120 triệu","1,2 triệu","oWZbWzAyHAE","Tỷ lệ chuyển đổi và chi phí phục vụ bản miễn phí quyết định hiệu quả.","Tỷ lệ chuyển đổi và chi phí phục vụ bản miễn phí quyết định hiệu quả."],["Case Study: Amazon","Case study","Minh họa nhiều mô hình cùng tồn tại: bán lẻ trực tiếp, marketplace và dịch vụ hạ tầng. Không gộp GMV của người bán với doanh thu của nền tảng.","Một người bán giao dịch 10 triệu; phí nền tảng giả định 12% = 1,2 triệu.","Lập hai Canvas riêng cho bán lẻ và marketplace.","Phí 12% của 10 triệu?","1,2 triệu","12 triệu","10 triệu","oWZbWzAyHAE","Phân tích từng phân khúc; mô hình lai cần báo cáo theo từng nguồn doanh thu.","Phân tích từng phân khúc; mô hình lai cần báo cáo theo từng nguồn doanh thu."],["Case Study: Airbnb","Case study","Minh họa marketplace kết nối người sở hữu chỗ ở và khách. Nền tảng tăng niềm tin thông qua hồ sơ, đánh giá và xử lý giao dịch.","Giả định 100 đêm đặt × 800.000đ, phí giả định 10% = 8 triệu doanh thu phí.","Phân tích cách có nguồn cung tại một khu vực trước khi mở rộng.","100 × 800.000 × 10%?","8 triệu","80 triệu","800 nghìn","oWZbWzAyHAE","Tỷ lệ đặt thành công, chất lượng và quy định địa phương là rủi ro.","Tỷ lệ đặt thành công, chất lượng và quy định địa phương là rủi ro."],["Case Study: Grab","Case study","Minh họa nền tảng đa dịch vụ kết nối khách, tài xế và thương nhân. Mỗi dịch vụ có logic phí, khuyến mãi và chi phí vận hành khác nhau.","Một đơn 100.000đ, phí giả định 15.000đ, trợ giá 8.000đ và hỗ trợ 2.000đ: đóng góp 5.000đ.","So sánh đóng góp một đơn có và không trợ giá.","15.000 − 8.000 − 2.000?","5.000đ","15.000đ","25.000đ","oWZbWzAyHAE","Tăng GMV không đảm bảo cải thiện đóng góp; xem mật độ đơn và giữ chân.","Tăng GMV không đảm bảo cải thiện đóng góp; xem mật độ đơn và giữ chân."],["Case Study: Duolingo","Case study","Minh họa freemium, subscription và quảng cáo; thói quen học tập góp phần duy trì người dùng. Phân biệt DAU, người đăng ký trả phí và doanh thu.","Giả định 100.000 MAU, 3% trả 100.000đ/tháng = 300 triệu MRR.","Đề xuất thử nghiệm cải thiện tỷ lệ nâng cấp mà không giảm retention.","100.000 × 3% × 100.000đ?","300 triệu","30 triệu","3 tỷ","oWZbWzAyHAE","Đánh giá hiệu quả bằng nhóm khách theo thời điểm đăng ký, không chỉ MAU.","Đánh giá hiệu quả bằng nhóm khách theo thời điểm đăng ký, không chỉ MAU."],["Case Study: Shopify","Case study","Minh họa SaaS B2B cho nhà bán hàng, có thể kết hợp subscription và dịch vụ thanh toán. Mục tiêu là giúp thương nhân vận hành cửa hàng.","Giả định 200 cửa hàng trả 500.000đ/tháng = 100 triệu MRR, doanh thu dịch vụ tính riêng.","Vẽ Canvas cho một công cụ hỗ trợ nhà bán.","200 × 500.000đ?","100 triệu","10 triệu","1 tỷ","oWZbWzAyHAE","Theo dõi tỷ lệ thương nhân hoạt động và rời bỏ; phân biệt doanh thu nền tảng với doanh số nhà bán.","Theo dõi tỷ lệ thương nhân hoạt động và rời bỏ; phân biệt doanh thu nền tảng với doanh số nhà bán."],["Go-to-Market & Sales Funnel","Chuyên sâu","GTM xác định khách hàng đầu tiên, thông điệp, kênh, giá và quy trình bán. Funnel đo chuyển đổi giữa các bước.","1.000 lead, 100 demo, 20 hợp đồng: lead-to-sale 2%.","Lập funnel và mục tiêu 90 ngày.","20 hợp đồng/1.000 lead là?","2%","20%","0,2%","hyYCn_kAngI","Đo CAC theo kênh và chu kỳ bán; hỏi bước nào đang tắc.","Đo CAC theo kênh và chu kỳ bán; hỏi bước nào đang tắc."],["Retention & Cohort","Chuyên sâu","Cohort nhóm người dùng theo thời điểm hoặc đặc điểm chung; đo bao nhiêu quay lại ở kỳ tiếp theo. So sánh cùng định nghĩa hoạt động.","100 khách tháng 1, 70 hoạt động tháng 2: retention 70%.","Lập bảng 3 cohort và giải thích xu hướng.","70/100 bằng?","70%","30%","170%","","Tách retention theo phân khúc; tăng acquisition có thể che giấu churn.","Tách retention theo phân khúc; tăng acquisition có thể che giấu churn."],["Startup Fundraising & Cap Table","Chuyên sâu","Vốn cổ phần đổi lấy quyền sở hữu; phân biệt pre-money, post-money và dilution. Giá trị sau đầu tư = pre-money + vốn mới trong ví dụ đơn giản.","Pre-money 8 tỷ, đầu tư 2 tỷ: post-money 10 tỷ, nhà đầu tư 20% giả định không có điều chỉnh khác.","Tính cổ phần trước và sau một vòng vốn.","2 tỷ/10 tỷ bằng?","20%","25%","2%","","Đọc kỹ điều khoản và các quyền, không chỉ định giá; số liệu ví dụ không phải tư vấn đầu tư.","Đọc kỹ điều khoản và các quyền, không chỉ định giá; số liệu ví dụ không phải tư vấn đầu tư."],["Mentor Clinic & Demo Day Simulation","Chuyên sâu","Trước Demo Day cần kiểm tra câu chuyện, logic số liệu, demo, thời gian và câu hỏi khó. Mentor hỗ trợ founder tự xác định giả thuyết và bằng chứng.","Startup báo có 1.000 đăng ký nhưng chưa đo số người mua; mentor hỏi conversion, dữ liệu cohort và thử nghiệm giá.","Tự chấm pitch theo vấn đề, giá trị, mô hình, traction, đội ngũ và next step; luyện 3 phút.","Khi founder chưa kiểm chứng giá, nên?","Đặt thử nghiệm willingness-to-pay","Khẳng định doanh thu chắc chắn","Chỉ chỉnh slide","17XZGUX_9iM","Kết thúc bằng hành động cụ thể và thời hạn; nêu rõ giả định.","Kết thúc bằng hành động cụ thể và thời hạn; nêu rõ giả định."],["Portfolio Review: Business Model Audit","Chuyên sâu","Tổng hợp từ khách hàng, Canvas, cơ chế doanh thu, chi phí, bằng chứng, cạnh tranh đến rủi ro. Đánh giá theo giai đoạn thay vì cùng một tiêu chuẩn doanh thu.","Một nhóm pre-MVP có bằng chứng phỏng vấn nhưng chưa có khách trả tiền; ưu tiên thử nghiệm nhu cầu và giá.","Hoàn thành hồ sơ 1 trang, Canvas, bảng kinh tế đơn vị, pitch và kế hoạch 30 ngày.","Ưu tiên pre-MVP thường là gì?","Kiểm chứng nhu cầu và khả năng trả","Mở rộng bằng mọi giá","Tuyên bố PMF","","Hỏi điều gì có thể khiến mô hình sai và bằng chứng nào sẽ thay đổi quyết định.","Hỏi điều gì có thể khiến mô hình sai và bằng chứng nào sẽ thay đổi quyết định."],["White-label & OEM","Chuyên sâu","Nhà sản xuất cung cấp sản phẩm để đối tác bán dưới thương hiệu riêng; OEM sản xuất theo yêu cầu. Lợi thế đến từ chất lượng, sản lượng, giá và vận hành.","Nhà máy gia công 1.000 sản phẩm với phí 80.000đ/đơn vị, doanh thu 80 triệu.","So sánh sản xuất thương hiệu riêng và white-label theo biên, vốn và quyền kiểm soát.","1.000 × 80.000đ?","80 triệu","8 triệu","800 triệu","oWZbWzAyHAE","Rủi ro phụ thuộc khách lớn và áp lực giá; hỏi điều khoản chất lượng và năng lực dự phòng.","Rủi ro phụ thuộc khách lớn và áp lực giá; hỏi điều khoản chất lượng và năng lực dự phòng."],["Dropshipping","Chuyên sâu","Người bán nhận đơn, nhà cung cấp giao trực tiếp; người bán không cần tích trữ nhiều nhưng vẫn chịu trách nhiệm trải nghiệm khách và biên lợi nhuận.","Bán 300.000đ, giá nhà cung cấp 180.000đ, giao hàng 30.000đ, quảng cáo 60.000đ: đóng góp 30.000đ.","Tính biên sau hoàn hàng và marketing.","Đóng góp trước chi phí cố định?","30.000đ","120.000đ","300.000đ","oWZbWzAyHAE","Rủi ro giao hàng chậm, hoàn tiền và kiểm soát chất lượng; thử nghiệm nhà cung cấp.","Rủi ro giao hàng chậm, hoàn tiền và kiểm soát chất lượng; thử nghiệm nhà cung cấp."],["Membership & Community","Chuyên sâu","Thành viên trả phí để tiếp cận cộng đồng, nội dung hoặc quyền lợi. Khác thuê bao nội dung đơn thuần vì nhiều giá trị đến từ tương tác giữa thành viên.","Cộng đồng nghề nghiệp 300 thành viên × 200.000đ/tháng = 60 triệu MRR.","Thiết kế quyền lợi và hoạt động giữ chân theo tháng.","300 × 200.000đ?","60 triệu","6 triệu","600 triệu","oWZbWzAyHAE","Đo tham gia thực tế và tỷ lệ tái đăng ký, không chỉ số thành viên.","Đo tham gia thực tế và tỷ lệ tái đăng ký, không chỉ số thành viên."],["Manufacturing & Wholesale","Chuyên sâu","Nhà sản xuất tạo sản phẩm và bán số lượng lớn cho nhà phân phối hoặc bán lẻ. Quan trọng là công suất, tồn kho, giá vốn và điều khoản thanh toán.","Bán 5.000 đơn vị × 40.000đ = 200 triệu doanh thu; giá vốn 25.000đ/đơn vị.","Tính lãi gộp và vốn lưu động nếu khách trả chậm.","Lãi gộp 5.000 × 15.000đ?","75 triệu","125 triệu","200 triệu","oWZbWzAyHAE","Kiểm tra vòng quay tồn kho, công suất nhàn rỗi và thu hồi công nợ.","Kiểm tra vòng quay tồn kho, công suất nhàn rỗi và thu hồi công nợ."],["Pay-what-you-want","Chuyên sâu","Khách tự chọn số tiền trả trong phạm vi quy định. Phù hợp khi có chi phí biên thấp, niềm tin hoặc mục tiêu tiếp cận; có thể đặt giá đề xuất.","Sách điện tử có giá gợi ý 100.000đ, 80 người trả trung bình 60.000đ.","Thiết kế thử nghiệm giá gợi ý và đo doanh thu/khách.","80 × 60.000đ?","4,8 triệu","48 triệu","480 nghìn","oWZbWzAyHAE","Đo tỷ lệ trả tiền, function calculate(){const get=id=>Number($("#"+id).value),p=get("price"),v=get("variable"),f=get("fixed"),c=get("cac"),m=get("monthly"),life=get("life");if([p,v,f,c,m,life].some(x=>!Number.isFinite(x)||x<0)){$("#calcresult").textContent="Vui lòng nhập số không âm.";return}const cm=p-v,fmt=n=>Number.isFinite(n)?n.toLocaleString("vi-VN",{maximumFractionDigits:2}):"Không xác định";$("#calcresult").innerHTML="<b>Biên đóng góp/đơn:</b> "+fmt(cm)+" đ<br><b>Hòa vốn:</b> "+(cm>0?fmt(Math.ceil(f/cm))+" đơn/tháng":"Không thể hòa vốn với biên hiện tại")+"<br><b>LTV đóng góp:</b> "+fmt(m*life)+" đ<br><b>LTV/CAC:</b> "+(c>0?fmt(m*life/c):"Không xác định")+"<br><b>Thời gian hoàn CAC:</b> "+(m>0?fmt(c/m)+" tháng":"Không xác định")}
