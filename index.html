<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Venture Workbench</title><style>
:root{--nav:#102437;--ink:#183047;--muted:#61758a;--accent:#087e78;--bg:#f3f6fa;--line:#dce5ec}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.65 system-ui,sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer;border:0;border-radius:9px;padding:11px 16px;background:var(--accent);color:#fff;font-weight:650}button:hover{filter:brightness(.92)}button.secondary{background:#e8f1f2;color:#12655e}button:disabled{opacity:.5;cursor:default}a{color:var(--accent);font-weight:600}h1,h2,h3,p{margin:0 0 12px}h1{font-size:clamp(26px,4vw,38px);letter-spacing:-1px;line-height:1.25}h2{font-size:23px}small,.muted{color:var(--muted)}.layout{min-height:100vh;display:grid;grid-template-columns:250px 1fr}.side{background:var(--nav);color:white;padding:28px 20px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column}.brand{font-size:21px;font-weight:800;letter-spacing:-.5px}.tag{font-size:13px;color:#80cfc4;text-transform:uppercase;letter-spacing:1.6px}.nav{margin:32px 0;display:grid;gap:7px}.nav button{text-align:left;background:transparent;color:#bed0df}.nav button.active{background:#26485d;color:white}.side .bottom{margin-top:auto}.main{max-width:1220px;width:100%;padding:35px;margin:auto;align-self:start}.hero{background:linear-gradient(125deg,#102d40,#086c68);border-radius:20px;padding:32px;color:white;display:flex;justify-content:space-between;gap:20px;align-items:center}.hero p{color:#c7e8e4}.hero b{font-size:40px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin:20px 0}.card{background:white;border:1px solid var(--line);border-radius:14px;padding:21px;margin-bottom:15px}.stat strong{display:block;font-size:30px}.progress{height:9px;background:#d7e4e7;border-radius:20px;overflow:hidden}.progress i{display:block;background:#18b4a0;height:100%}.row{display:flex;gap:12px;align-items:center;justify-content:space-between}.pill{display:inline-block;font-size:13px;padding:3px 10px;border-radius:999px;background:#e3f4ef;color:#116b60;font-weight:650}.week{margin-top:26px}.lesson{display:grid;grid-template-columns:48px 1fr auto;gap:12px;align-items:center}.number{background:#eaf2f9;color:#244b68;display:grid;place-items:center;width:42px;height:42px;border-radius:12px;font-weight:750}.lesson h3{margin:0;font-size:17px}.lesson p{margin:0}.study{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:18px}.video{aspect-ratio:16/9;width:100%;border:0;border-radius:12px;background:#0b2030}.callout{background:#eff8f6;border-left:4px solid var(--accent);padding:14px;border-radius:8px;margin:15px 0}.answers{display:grid;gap:10px}.answers button{text-align:left;background:#edf2f6;color:var(--ink)}.answers .right{background:#d8f4e5}.answers .wrong{background:#ffe5e5}textarea,input,select{width:100%;padding:12px;border:1px solid #c7d5df;border-radius:9px;background:white;color:var(--ink)}textarea{min-height:130px;resize:vertical}.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}.day{padding:12px 4px;text-align:center;background:#eaf0f5;border-radius:8px;font-size:14px}.day.on{background:#c3eedf;color:#075e50;font-weight:bold}.auth{min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(circle at top right,#176b71,#102437 60%)}.auth .card{max-width:420px;width:100%;padding:30px}.auth label{display:block;margin:12px 0 4px}.auth button{width:100%;margin-top:18px}.error{color:#b32636}.links a{display:block;padding:9px 0;border-bottom:1px solid var(--line)}.search{max-width:450px}.canvas{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.canvas label{font-weight:650}.canvas textarea{margin-top:6px}.hide{display:none!important}@media(max-width:850px){.layout{display:block}.side{position:relative;height:auto;padding:16px}.nav{display:flex;overflow:auto;margin:12px 0 0}.nav button{white-space:nowrap}.side .bottom{margin-top:10px}.main{padding:18px}.study{display:block}.grid{grid-template-columns:1fr 1fr}.hero{display:block}.canvas{grid-template-columns:1fr}.lesson{grid-template-columns:40px 1fr}.lesson button{grid-column:2}.calendar{gap:4px}}@media(max-width:430px){.grid{grid-template-columns:1fr}}
</style></head><body><div id="app"></div><script>
const lessons=[["Mô hình kinh doanh là gì?","Business model","Giải thích doanh nghiệp tạo ra, chuyển giao và thu về giá trị như thế nào. Khác với kế hoạch kinh doanh, mô hình là logic vận hành; kế hoạch bổ sung mục tiêu, lịch và dự báo.","Một quán cà phê thu tiền theo ly; phần mềm quản lý thu tiền theo tháng. Cùng phục vụ nhu cầu nhưng cơ chế doanh thu khác.","Chọn một startup giả định và mô tả khách hàng, giá trị, cách kiếm tiền trong 3 câu.","Business model trả lời câu hỏi nào?","Cách tạo và thu giá trị","Chỉ màu logo","Chỉ tên founder","QoAOzMTLP5s"],["9 khối Business Model Canvas","BMC","Canvas liên kết phân khúc, giá trị, kênh, quan hệ, doanh thu, nguồn lực, hoạt động, đối tác và chi phí. Điền dưới dạng giả thuyết rồi kiểm chứng.","Ứng dụng đặt phòng: người trả tiền là doanh nghiệp; người dùng là nhân viên; phần mềm và hỗ trợ là nguồn lực.","Vẽ 9 ô cho ví dụ của bạn.","Canvas có bao nhiêu khối?","9","5","12","QoAOzMTLP5s"],["Customer Segments","Khách hàng","Phân biệt người dùng và người trả tiền; ưu tiên phân khúc có vấn đề cấp thiết, khả năng chi trả, tiếp cận được.","EdTech: học sinh sử dụng, phụ huynh trả tiền, trường có thể quyết định.","Liệt kê 3 nhóm khách và chọn 1 nhóm đầu tiên.","Ai có thể khác người dùng?","Người trả tiền","Tên miền","Màu thương hiệu","ReM1uqmVfP0"],["Value Proposition","Giá trị","Giá trị là lợi ích đo được cho nhóm khách cụ thể. Dùng jobs, pains, gains để liên kết nhu cầu với giải pháp.","Dịch vụ giao hàng giúp nhà bán giảm thời gian đóng gói và tỷ lệ giao thất bại.","Viết một câu giá trị có nhóm khách, vấn đề, lợi ích.","Giá trị tốt nhất nên dựa vào?","Nhu cầu có bằng chứng","Số tính năng","Tên sản phẩm","ReM1uqmVfP0"],["Channels","Kênh","Kênh đưa khách từ nhận biết đến đánh giá, mua, nhận sản phẩm và hậu mãi. Đo tỷ lệ chuyển đổi và chi phí từng bước.","SaaS B2B: webinar tạo lead, demo hỗ trợ quyết định, hợp đồng hoàn tất giao dịch.","Vẽ hành trình 5 bước và đề xuất KPI cho từng bước.","Kênh có nhiệm vụ gì?","Tiếp cận và giao giá trị","Thay thế doanh thu","Định giá cổ phần",""],["Customer Relationships","Quan hệ","Quan hệ có thể tự phục vụ, hỗ trợ cá nhân, cộng đồng hoặc quản lý khách hàng chuyên sâu; chọn theo giá trị và chi phí phục vụ.","Khách enterprise có account manager; khách cá nhân dùng hướng dẫn tự động.","Chọn cách onboarding, hỗ trợ, giữ chân khách.","Churn cao cho thấy điều gì?","Khách rời bỏ nhiều","Doanh thu luôn tăng","Không cần hỗ trợ",""],["Revenue Streams","Doanh thu","Xác định ai trả, trả vì điều gì, bao nhiêu, khi nào. Doanh thu khác lợi nhuận và dòng tiền.","100 khách trả 200.000đ/tháng tạo MRR 20 triệu, chưa trừ chi phí.","Tạo 2 mức giá và giả định số khách.","MRR của 100 khách × 200.000đ là?","20 triệu","2 triệu","200 triệu","oWZbWzAyHAE"],["Key Resources","Nguồn lực","Tài sản thiết yếu gồm nhân sự, tài chính, dữ liệu, công nghệ và thương hiệu. Phân biệt sở hữu với thuê.","Marketplace cần hệ thống thanh toán, dữ liệu giao dịch và đội vận hành.","Chọn 3 tài sản cần có và 1 rủi ro thiếu hụt.","Nguồn lực chính là?","Tài sản cần để vận hành","Tất cả chi phí","Mọi khách hàng",""],["Key Activities","Hoạt động","Các công việc cốt lõi phải làm tốt để cung cấp giá trị, ví dụ phát triển sản phẩm, tuyển nhà cung cấp, hỗ trợ.","Ứng dụng đặt lịch cần duy trì độ chính xác, xử lý xung đột và hỗ trợ.","Chọn 3 hoạt động; đặt chỉ số chất lượng.","Hoạt động chính nên liên kết với?","Giá trị khách hàng","Màu website","Tên pháp nhân",""],["Key Partners","Đối tác","Đối tác cung cấp nguồn lực, năng lực hoặc kênh mà startup khó tự làm; xem phụ thuộc và phương án dự phòng.","Startup thanh toán hợp tác ngân hàng và nhà cung cấp hạ tầng.","Lập danh sách đối tác, lợi ích hai bên, rủi ro.","Đối tác quan trọng vì?","Bổ sung năng lực và giảm rủi ro","Luôn thay thế khách","Không cần hợp đồng",""],["Cost Structure","Chi phí","Chi phí cố định ít thay đổi theo sản lượng; biến đổi tăng theo số đơn vị. Phân biệt chi phí đầu tư và vận hành.","Phí thuê văn phòng cố định, phí giao hàng theo đơn biến đổi.","Tính chi phí tháng của mô hình giả định.","Phí giao mỗi đơn thường là?","Chi phí biến đổi","Vốn chủ sở hữu","Doanh thu",""],["Workshop Canvas","Thực hành","Kiểm tra 9 khối có nhất quán, các giả định phải có chủ sở hữu, cách đo và hạn kiểm chứng.","Giá rẻ nhưng bán qua đội tư vấn đắt tiền có thể không khả thi.","Hoàn thiện BMC một trang, đánh dấu 3 giả định rủi ro.","BMC nên được cập nhật khi?","Có bằng chứng mới","Chỉ cuối năm","Không bao giờ","QoAOzMTLP5s"],["B2B, B2C, B2G","Phân loại","B2B bán cho tổ chức, B2C bán cho cá nhân, B2G bán cho cơ quan công. Khác nhau về chu kỳ bán, ngân sách, ra quyết định.","Phần mềm kế toán doanh nghiệp là B2B; ứng dụng tập thể dục cá nhân là B2C.","So sánh 3 mô hình theo người mua, kênh và chu kỳ bán.","Bán phần mềm cho công ty là?","B2B","B2C","P2P","oWZbWzAyHAE"],["SaaS & Subscription","Định kỳ","SaaS cung cấp phần mềm dưới dạng dịch vụ; subscription là cơ chế trả định kỳ, không chỉ phần mềm. Theo dõi MRR, churn và retention.","Khách thuê phần mềm 500.000đ/tháng thay vì mua giấy phép vĩnh viễn.","Thiết kế 2 gói tháng và tính MRR.","Subscription đặc trưng bởi?","Thanh toán định kỳ","Chỉ bán một lần","Chỉ quảng cáo","oWZbWzAyHAE"],["Marketplace & Platform","Thị trường hai phía","Nền tảng kết nối nhiều nhóm, thường có hiệu ứng mạng. Khởi đầu khó vì mỗi phía cần phía kia; đo thanh khoản và take rate.","100 triệu GMV × 10% phí tạo 10 triệu doanh thu nền tảng.","Chọn cách thu hút phía cung trước.","GMV 100 triệu × 10% phí =?","10 triệu doanh thu","100 triệu lợi nhuận","1 triệu doanh thu","oWZbWzAyHAE"],["Freemium & Advertising","Miễn phí","Freemium mở bản miễn phí lâu dài, thu tiền nâng cấp; quảng cáo bán sự chú ý của người dùng. Đo tỷ lệ trả tiền và chi phí phục vụ.","1.000 người dùng, 5% nâng cấp, giá 100.000đ/tháng tạo 5 triệu MRR.","Đề xuất tính năng miễn phí và trả tiền.","Freemium khác free trial ở đâu?","Có gói miễn phí lâu dài","Không có người trả tiền","Chỉ bán phần cứng","oWZbWzAyHAE"],["E-commerce, D2C & Licensing","Bán hàng","D2C bán trực tiếp từ thương hiệu đến người dùng; licensing cấp quyền sử dụng tài sản trí tuệ; franchise cung cấp hệ thống kinh doanh theo hợp đồng.","Thương hiệu mỹ phẩm bán trực tiếp website; phần mềm cấp quyền dùng theo kỳ.","So sánh biên gộp, quyền kiểm soát và vốn cần thiết.","D2C giảm vai trò của?","Trung gian phân phối","Người dùng","Sản phẩm","oWZbWzAyHAE"],["Pricing & Unit Economics","Định giá","Giá phản ánh giá trị và sự sẵn sàng trả; CAC là chi phí có khách mới, LTV là giá trị đóng góp ước tính suốt vòng đời.","CAC 300.000đ; lãi gộp mỗi tháng 100.000đ; giữ khách 6 tháng: LTV 600.000đ, tỷ lệ 2.","Tính LTV/CAC của ví dụ riêng và nêu giả định.","LTV 600.000/CAC 300.000 bằng?","2","0,5","6","oWZbWzAyHAE"],["Customer Discovery","Kiểm chứng","Phỏng vấn hành vi đã xảy ra; hỏi lần gần nhất gặp vấn đề, hậu quả, giải pháp hiện tại. Tránh hỏi dẫn dắt.","Thay vì hỏi bạn có mua không, hỏi lần gần nhất mất bao lâu và đã trả bao nhiêu.","Soạn 5 câu phỏng vấn trung lập.","Bằng chứng mạnh hơn là?","Hành vi thực tế","Lời khen","Ý kiến founder",""],["MVP & Lean Startup","Thử nghiệm","MVP là phiên bản tối thiểu để kiểm chứng giả thuyết quan trọng. Xây dựng, đo, học; tiếp tục, thay đổi hoặc dừng theo dữ liệu.","Trang giới thiệu với đăng ký thử có thể kiểm tra nhu cầu trước khi phát triển hệ thống.","Viết giả thuyết, thử nghiệm, ngưỡng thành công.","MVP nhằm mục tiêu chính nào?","Học từ kiểm chứng","Đầy đủ mọi tính năng","Tối ưu logo",""],["TAM, SAM, SOM","Thị trường","TAM là tổng thị trường lý thuyết; SAM phần có thể phục vụ; SOM phần có thể đạt được trong thời hạn cụ thể. Ước tính từ dưới lên.","500 trường mục tiêu × 20 triệu/năm = 10 tỷ doanh thu tiềm năng trong phạm vi đó.","Tính 3 lớp thị trường với giả định có nguồn.","SOM là?","Phần có khả năng chiếm được","Toàn bộ thế giới","Tổng chi phí",""],["Traction & PMF","Tăng trưởng","Traction là bằng chứng tiến triển như doanh thu, khách trả tiền, retention. PMF là tín hiệu sản phẩm đáp ứng nhu cầu thị trường, không chỉ lượt đăng ký.","100 đăng ký nhưng 2 người dùng lặp lại yếu hơn 30 khách trả tiền giữ chân tốt.","Chọn 3 KPI theo giai đoạn startup.","Chỉ số nào phản ánh giữ chân?","Retention","Lượt xem logo","Số slide",""],["Tài chính & Break-even","Tài chính","Lãi gộp = doanh thu − giá vốn. Điểm hòa vốn đơn vị = chi phí cố định / (giá − biến phí đơn vị). Runway = tiền mặt / burn ròng nếu burn ổn định.","Chi phí cố định 30 triệu; giá 100k; biến phí 40k: hòa vốn 500 đơn.","Tính hòa vốn và runway với số liệu giả định.","30 triệu / 60.000 bằng?","500","50","5.000",""],["Cạnh tranh & Moat","Chiến lược","Xác định đối thủ trực tiếp, gián tiếp và lựa chọn không làm gì. Moat là lợi thế khó sao chép, có thể đến từ mạng lưới, quy mô, dữ liệu hoặc chuyển đổi.","Khách có thể dùng Excel thay cho SaaS đặt lịch; đó là đối thủ gián tiếp.","Lập bảng 3 giải pháp thay thế theo giá trị, giá và rủi ro.","Đối thủ gián tiếp có thể là?","Excel thay cho SaaS","Chỉ các công ty giống hệt","Không ai",""],["Pitch Deck","Thuyết trình","Một pitch rõ ràng kể vấn đề, giải pháp, thị trường, mô hình, traction, cạnh tranh, đội ngũ và nhu cầu hỗ trợ. Dùng số liệu có nguồn.","Mở bằng tình huống cụ thể rồi chứng minh tác động, không mở bằng danh sách tính năng.","Viết pitch 60 giây và outline 8 slide.","Pitch nên bắt đầu bằng?","Vấn đề đáng giải quyết","Lịch sử mọi nhân viên","Các hiệu ứng slide",""],["Demo Day & Q&A","Ứng dụng","Demo Day là dịp startup trình bày sản phẩm và tiến triển trước nhà đầu tư, mentor hoặc đối tác. Chuẩn bị demo ổn định, câu trả lời bằng dữ liệu, kế hoạch follow-up.","Mentor hỏi CAC, startup giải thích nguồn số liệu, giai đoạn thử nghiệm và bước tiếp theo.","Chuẩn bị 10 câu hỏi nhà đầu tư và câu trả lời 30 giây.","Nếu chưa có số liệu, nên?","Nêu rõ chưa kiểm chứng và kế hoạch","Bịa số liệu","Né mọi câu hỏi",""],["Đánh giá startup","Mentor","Đánh giá mức độ hiểu khách, bằng chứng nhu cầu, chất lượng giải pháp, khả năng kiếm tiền, năng lực đội và rủi ro. Tách giả thuyết khỏi dữ liệu.","Prototype chưa có doanh thu vẫn có thể có bằng chứng phỏng vấn và thử nghiệm tốt.","Chấm startup giả định theo 6 tiêu chí, mỗi tiêu chí 1–5 và lý do.","Một giả thuyết chưa kiểm chứng nên?","Đánh dấu và thử nghiệm","Coi như sự thật","Xóa khỏi phân tích",""],["Capstone: hoàn thiện mô hình","Tổng kết","Kết nối Canvas với phỏng vấn, tài chính, traction và pitch. Mỗi quyết định cần bằng chứng hoặc kế hoạch kiểm chứng.","Một startup giả định hoàn thành BMC, bảng unit economics, pitch 3 phút và 30 ngày thử nghiệm.","Nộp BMC + 1 trang tài chính + pitch + 3 thử nghiệm ưu tiên.","Kết quả tốt nhất của khóa là?","Mô hình có logic và kế hoạch kiểm chứng","Chỉ nhớ định nghĩa","Chỉ xem hết video",""]];const weeks=["Nền tảng & khách hàng","Vận hành Canvas","Các mô hình & kiếm tiền","Kiểm chứng & tăng trưởng","Demo Day & tổng kết"];const ranges=[[0,6],[6,12],[12,18],[18,24],[24,28]];const $=s=>document.querySelector(s);const key="venture-workbench-v1";const safe=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));let state;try{state=JSON.parse(localStorage.getItem(key))||{}}catch{state={}};state.done??={};state.att??={};state.notes??={};state.quiz??={};state.canvas??={};let view="home",current=0;const save=()=>localStorage.setItem(key,JSON.stringify(state));const today=()=>new Intl.DateTimeFormat("sv-SE",{timeZone:"Asia/Ho_Chi_Minh"}).format(new Date());const dateLabel=d=>new Date(d+"T12:00:00").toLocaleDateString("vi-VN");const count=()=>Object.keys(state.done).length;const percent=()=>Math.round(count()/lessons.length*100);const next=()=>lessons.findIndex((_,i)=>!state.done[i]);const route=v=>{view=v;render();window.scrollTo(0,0)};const openLesson=i=>{current=i;route("study")};const sources='<a href="https://www.udacity.com/course/how-to-build-a-startup--ep245" target="_blank" rel="noopener">Udacity • How to Build a Startup (miễn phí)</a><a href="https://www.strategyzer.com/library/the-business-model-canvas" target="_blank" rel="noopener">Strategyzer • Canvas & mẫu PDF miễn phí</a><a href="https://www.udemy.com/course/start-business-model-course/" target="_blank" rel="noopener">Udemy • 31 Startup Business Models (trả phí)</a><a href="https://www.ycombinator.com/library/6q-how-to-pitch-your-startup" target="_blank" rel="noopener">Y Combinator • How to Pitch Your Startup (miễn phí)</a><a href="https://yc-startup-school.relayto.com/e/how-to-talk-to-users-rmdawvc59tr6j?doc-hub=yc-startup-school-5d4bfd2ad9079&hub=yc-startup-school-5d4bfd2ad9079" target="_blank" rel="noopener">YC • How to Talk to Users (miễn phí)</a>';
async function digest(p,s){const k=await crypto.subtle.importKey("raw",new TextEncoder().encode(p),"PBKDF2",false,["deriveBits"]);const b=await crypto.subtle.deriveBits({name:"PBKDF2",salt:new TextEncoder().encode(s),iterations:200000,hash:"SHA-256"},k,256);return Array.from(new Uint8Array(b),x=>x.toString(16).padStart(2,"0")).join("")}
function auth(){const unconfigured=!state.verifier;$("#app").innerHTML='<div class="auth"><form class="card" id="auth"><div class="tag">VENTURE WORKBENCH</div><h1>'+ (unconfigured?'Thiết lập lần đầu':'Đăng nhập')+'</h1><p class="muted">'+(unconfigured?'Nhập tài khoản admin và đặt mật khẩu bạn muốn dùng trên thiết bị này.':'Tiếp tục lộ trình học của bạn.')+'</p><label>Tài khoản</label><input name="user" required autocomplete="username" value="admin"><label>Mật khẩu</label><input name="pass" type="password" required minlength="8" autocomplete="'+(unconfigured?'new-password':'current-password')+'"><button> '+(unconfigured?'Thiết lập & bắt đầu':'Đăng nhập')+'</button><p id="err" class="error" role="alert"></p><small>Đây là khóa hồ sơ cục bộ trên GitHub Pages, không phải bảo mật máy chủ. Không dùng mật khẩu của dịch vụ khác.</small></form></div>';$("#auth").onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target),p=f.get("pass");try{if(f.get("user")!=="admin")throw Error("Tài khoản không đúng.");if(unconfigured){state.salt=crypto.randomUUID();state.verifier=await digest(p,state.salt);save()}else if(await digest(p,state.salt)!==state.verifier)throw Error("Mật khẩu không đúng.");sessionStorage.setItem(key+"-login","1");render()}catch(err){$("#err").textContent=err.message}}}

function roadmap(){return '<h1>Lộ trình học</h1><p class="muted">28 buổi · 5 chặng · từ nền tảng đến thực hành</p><input class="search" placeholder="Tìm chủ đề..." oninput="filterLessons(this.value)"><div id="list">'+ranges.map((r,k)=>'<section class="week"><h2>Chặng '+(k+1)+' · '+weeks[k]+'</h2>'+lessons.slice(...r).map((_,j)=>markup(r[0]+j)).join("")+'</section>').join("")+'</div>'}
